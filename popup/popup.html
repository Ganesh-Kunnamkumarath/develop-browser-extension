<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Health Tracker</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="topbar">
    <img src="../icons/icon32.png" alt="" class="brand-icon" />
    <div class="brand-text">
      <h1>Health Tracker</h1>
      <p id="today-label">Today</p>
    </div>
    <button id="open-settings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <section class="score-row">
    <div class="score-ring-wrap">
      <div class="score-badge" id="score-badge">0/6</div>
      <div class="score-caption">Today's Score</div>
    </div>
    <div class="streak" id="streak-text">No streak yet</div>
  </section>

  <form id="entry-form" class="entry-form">
    <div class="field-grid">
      <label class="field">
        <span>Weight (kg)</span>
        <input type="number" step="0.1" min="0" name="weight" placeholder="—" />
      </label>
      <label class="field" data-habit="steps">
        <span>Steps <em>(goal 10,000)</em></span>
        <input type="number" step="100" min="0" name="steps" placeholder="0" />
      </label>
      <label class="field" data-habit="protein">
        <span>Protein (g) <em>(goal 80)</em></span>
        <input type="number" step="1" min="0" name="protein" placeholder="0" />
      </label>
      <label class="field" data-habit="water">
        <span>Water (L) <em>(goal 4)</em></span>
        <input type="number" step="0.1" min="0" name="water" placeholder="0" />
      </label>
      <label class="field" data-habit="sleep">
        <span>Sleep (h) <em>(goal 7)</em></span>
        <input type="number" step="0.5" min="0" name="sleep" placeholder="0" />
      </label>
    </div>

    <div class="checkbox-row">
      <label class="checkbox-field" data-habit="dinner">
        <input type="checkbox" name="dinner" />
        <span>Dinner Before 6 PM</span>
      </label>
      <label class="checkbox-field" data-habit="veg">
        <input type="checkbox" name="veg" />
        <span>Vegetables & Fiber</span>
      </label>
    </div>

    <label class="field notes-field">
      <span>Notes</span>
      <textarea name="notes" rows="2" placeholder="Anything worth remembering..."></textarea>
    </label>
  </form>

  <footer class="actions">
    <button id="open-dashboard" class="primary-btn">Open Full Tracker</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
